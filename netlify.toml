[build]
  # Preflight test config (Phase A): Vite build stood up, still a vanilla
  # app (no export-syntax conversion — that's gated on the Preflight
  # verification result). publish now points at the Vite build output.
  command   = "vite build"
  publish   = "dist"
  functions = "netlify/functions"

[dev]
  # Without this, Netlify's framework auto-detect picked "npm run test"
  # as the dev command (misdetected from package.json scripts) instead of
  # an actual Vite dev server — explicit config avoids that.
  command    = "npx vite --port 5173"
  targetPort = 5173
