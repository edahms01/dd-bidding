<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirigo Drywall — Bid System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- A2 spike: AppShell (header/left nav/tabs) + RatesPage + HistoryPage
     render here. Every not-yet-converted page's exact original markup is
     kept below in inert <template> tags — LegacyPage (src/pages/LegacyPage.jsx)
     clones a template's content into its own DOM once on first mount, then
     never lets React touch those children again, so the old vanilla
     scripts (populateForm(), addAsm(), calc(), etc.) keep operating on
     real, unmanaged DOM exactly as before. See CLAUDE.md and the A2 plan
     for the full coexistence architecture. -->
<div id="root"></div>

<template id="legacy-tpl-project">
  <div class="page-hdr">
    <div><div class="page-title">Project</div><div class="page-sub">Basic info and scope for this bid</div></div>
    <div class="page-actions"><button class="btn btn-primary" onclick="goto('conditions')">Next: Conditions →</button></div>
  </div>
  <div class="grid g3">
    <div class="field"><span class="lbl">Project name</span><input type="text" id="proj-name" placeholder="e.g. 400 Main St Office Tower"></div>
    <div class="field"><span class="lbl">General contractor</span><input type="text" id="proj-gc" placeholder="GC company name"></div>
    <div class="field"><span class="lbl">Bid due date</span><input type="date" id="proj-bid"></div>
  </div>
  <div class="grid g3">
    <div class="field"><span class="lbl">Project address</span><input type="text" id="proj-addr" placeholder="Street, city, state"></div>
    <div class="field"><span class="lbl">Building type</span>
      <select id="proj-type"><option value="">Select…</option><option>Office</option><option>Retail</option><option>Healthcare</option><option>Education</option><option>Hospitality</option><option>Mixed use</option><option>Other</option></select>
    </div>
    <div class="field"><span class="lbl">Drawing set ref</span><input type="text" id="proj-drawings" placeholder="e.g. Rev B — 2024-03-15"></div>
  </div>
  <div class="grid g3">
    <div class="field"><span class="lbl">Est. start date</span><input type="date" id="proj-start"></div>
    <div class="field"><span class="lbl">Duration (weeks)</span><input id="proj-dur" type="number" min="1" placeholder="e.g. 12"></div>
    <div class="field"><span class="lbl">Number of floors</span><input id="proj-floors" type="number" min="1" placeholder="e.g. 8"></div>
  </div>
  <div class="divider"></div>
  <div class="section-label">Scope inclusions</div>
  <div class="pills" style="margin-bottom:20px">
    <div class="pill on" data-scope="Metal framing" onclick="this.classList.toggle('on')">Metal framing</div>
    <div class="pill on" data-scope="Drywall" onclick="this.classList.toggle('on')">Drywall</div>
    <div class="pill" data-scope="Plastering" onclick="this.classList.toggle('on')">Plastering</div>
    <div class="pill" data-scope="External wall" onclick="this.classList.toggle('on')">External wall</div>
    <div class="pill" data-scope="Subcontractors" onclick="this.classList.toggle('on')">Subcontractors</div>
  </div>
  <div class="field"><span class="lbl">Exclusions / notes</span><textarea id="proj-exclusions" placeholder="e.g. Excludes ACT ceiling grid. GC supplying blocking."></textarea></div>
</template>

<template id="legacy-tpl-conditions">
  <div class="page-hdr">
    <div><div class="page-title">Conditions</div><div class="page-sub">Factors that affect labor rates, equipment needs, and contingency</div></div>
    <div class="page-actions">
      <button class="btn btn-ghost" onclick="goto('project')">← Back</button>
      <button class="btn btn-primary" onclick="goto('rates')">Next: Rates →</button>
    </div>
  </div>
  <div class="section-label">Height zones</div>
  <div class="grid g3" style="margin-bottom:24px">
    <div class="field"><span class="lbl">Max ceiling height (ft)</span><input id="cond-maxht" type="number" min="0" placeholder="e.g. 24"></div>
    <div class="field"><span class="lbl">SF above 12 ft</span><input id="cond-sf12" type="number" min="0" placeholder="sq ft — triggers lift adder"></div>
    <div class="field"><span class="lbl">SF above 20 ft</span><input id="cond-sf20" type="number" min="0" placeholder="sq ft — high-lift zone"></div>
  </div>
  <div class="section-label">Site flags</div>
  <div class="flag-grid">
    <div class="flag-card">
      <span class="lbl">Curved walls</span>
      <select id="f-curved" onchange="document.getElementById('f-curved-lf').style.display=this.value==='yes'?'block':'none'">
        <option value="no">No</option><option value="yes">Yes</option>
      </select>
      <input type="number" min="0" id="f-curved-lf" placeholder="LF of curved walls" style="display:none">
    </div>
    <div class="flag-card">
      <span class="lbl">Exterior exposure</span>
      <select id="f-exterior"><option value="no">No</option><option value="yes">Yes</option></select>
    </div>
    <div class="flag-card">
      <span class="lbl">Phased work</span>
      <select id="f-phase" onchange="document.getElementById('f-phase-n').style.display=this.value==='yes'?'block':'none'">
        <option value="no">No</option><option value="yes">Yes</option>
      </select>
      <input type="number" min="0" id="f-phase-n" placeholder="Number of phases" style="display:none">
    </div>
    <div class="flag-card">
      <span class="lbl">Access difficulty</span>
      <select id="f-access"><option value="normal">Normal</option><option value="restricted">Restricted</option></select>
    </div>
    <div class="flag-card">
      <span class="lbl">Parking / unloading</span>
      <select id="f-parking"><option value="yes">Available</option><option value="no">Restricted</option></select>
    </div>
    <div class="flag-card">
      <span class="lbl">Waste factor override</span>
      <input id="cond-waste" type="number" min="0" placeholder="% — blank = default (10%)">
    </div>
  </div>
  <div class="grid g2" style="margin-bottom:20px">
    <div class="field"><span class="lbl">Estimated delivery trips</span><input id="cond-trips" type="number" min="0" placeholder="e.g. 4"></div>
  </div>
  <div class="divider"></div>
  <div class="section-label" style="margin-bottom:10px">Estimator confidence</div>
  <div class="conf-row" style="margin-bottom:20px;max-width:500px">
    <button class="conf-btn" id="c-hi" onclick="setConf('hi')">High — straightforward</button>
    <button class="conf-btn" id="c-md" onclick="setConf('md')">Medium — some unknowns</button>
    <button class="conf-btn" id="c-lo" onclick="setConf('lo')">Low — significant risk</button>
  </div>
  <div class="field"><span class="lbl">Estimator notes</span><textarea id="cond-notes" style="min-height:100px" placeholder="Gut feelings, GC history, site concerns, anything not captured above…"></textarea></div>

  <div class="divider" style="margin-top:24px"></div>
  <div class="section-label">Market + competitive intelligence</div>

  <div class="sub-lbl" style="margin-top:4px">Market signals</div>
  <div class="flag-grid">
    <div class="flag-card">
      <span class="lbl">Crew availability</span>
      <select id="intel-crew">
        <option value="">Select…</option>
        <option value="full">Fully available</option>
        <option value="partial">Partially booked</option>
        <option value="tight">Nearly full</option>
      </select>
      <div class="rhint">Tight crews = higher margin target — agent uses this to set pricing floor</div>
    </div>
    <div class="flag-card">
      <span class="lbl">Pipeline pressure</span>
      <select id="intel-pipeline">
        <option value="">Select…</option>
        <option value="need">Need this job</option>
        <option value="neutral">Neutral</option>
        <option value="pass">Can afford to pass</option>
      </select>
      <div class="rhint">Direct signal on aggressiveness — agent weighs this heavily against final bid</div>
      <div class="rhint" id="pipeline-count-hint"></div>
    </div>
    <div class="flag-card">
      <span class="lbl">Material price trend</span>
      <select id="intel-material-trend">
        <option value="">Select…</option>
        <option value="stable">Stable</option>
        <option value="rising">Rising</option>
        <option value="falling">Falling</option>
      </select>
      <div class="rhint">Rising trend may warrant per-line rate escalation or higher contingency</div>
    </div>
    <div class="flag-card">
      <span class="lbl">GC relationship</span>
      <select id="intel-gc-rel">
        <option value="">Select…</option>
        <option value="strong">Strong</option>
        <option value="neutral">Neutral</option>
        <option value="new">New</option>
        <option value="difficult">Difficult</option>
      </select>
      <div class="rhint">Strong relationships reduce payment risk and may justify tighter margin</div>
    </div>
    <div class="flag-card">
      <span class="lbl">GC price sensitivity</span>
      <select id="intel-gc-price">
        <option value="">Select…</option>
        <option value="lowest">Always lowest price</option>
        <option value="balanced">Balanced</option>
        <option value="quality">Values quality</option>
      </select>
      <div class="rhint">Quality-focused GCs allow more margin; lowest-price GCs require sharp bids</div>
    </div>
  </div>

  <div class="sub-lbl">Competitive signals</div>
  <div class="flag-grid">
    <div class="flag-card">
      <span class="lbl">Competition level</span>
      <select id="intel-competition">
        <option value="">Select…</option>
        <option value="light">Light (1–2 bidders)</option>
        <option value="moderate">Moderate (3–4)</option>
        <option value="heavy">Heavy (5+)</option>
        <option value="unknown">Unknown</option>
      </select>
      <div class="rhint">More competition = tighter spread; agent adjusts recommended price accordingly</div>
    </div>
    <div class="flag-card">
      <span class="lbl">Known competitors</span>
      <input type="text" id="intel-competitors" placeholder="e.g. ABC Drywall, Smith &amp; Co.">
      <div class="rhint">Logged for Phase 5B win-rate pattern analysis — not used in current calculation</div>
    </div>
    <div class="flag-card">
      <span class="lbl">Dirigo's edge</span>
      <select id="intel-edge">
        <option value="">Select…</option>
        <option value="strong">Strong — we're best fit</option>
        <option value="neutral">Neutral</option>
        <option value="weak">Weak — others better positioned</option>
      </select>
      <div class="rhint">Self-assessed fit — strong edge supports premium pricing over competitors</div>
    </div>
  </div>
</template>

<template id="legacy-tpl-assemblies">
  <div class="page-hdr">
    <div><div class="page-title">Assembly types</div><div class="page-sub">Define each wall and ceiling system. Each type ID is referenced in walls and ceilings.</div></div>
    <div class="page-actions">
      <button class="btn btn-ghost" onclick="goto('rates')">← Back</button>
      <button class="btn btn-primary" onclick="goto('walls')">Next: Walls →</button>
    </div>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Type ID</th><th>Category</th><th>Stud size</th><th>Spacing</th>
        <th>Board layers</th><th>Board type</th><th>Fire rating</th>
        <th>Acoustic</th><th>Finish level</th><th>Notes</th><th>Waste %</th><th></th>
      </tr></thead>
      <tbody id="asm-body"></tbody>
    </table>
  </div>
  <button class="add-row-btn" onclick="addAsm()">+ Add assembly type</button>
</template>

<template id="legacy-tpl-walls">
  <div class="page-hdr">
    <div><div class="page-title">Wall quantities</div><div class="page-sub">One row per floor or zone. Net SF calculates automatically.</div></div>
    <div class="page-actions">
      <button class="btn btn-ghost" onclick="goto('assemblies')">← Back</button>
      <button class="btn btn-primary" onclick="goto('ceilings')">Next: Ceilings →</button>
    </div>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Location</th><th>Type ID</th><th>Height (ft)</th>
        <th>LF framing</th><th>Gross SF board</th><th>Openings (SF)</th><th>Net SF</th><th></th>
      </tr></thead>
      <tbody id="wall-body"></tbody>
    </table>
  </div>
  <button class="add-row-btn" onclick="addWall()">+ Add wall area</button>
</template>

<template id="legacy-tpl-ceilings">
  <div class="page-hdr">
    <div><div class="page-title">Ceiling + soffit quantities</div><div class="page-sub">One row per area. Net SF calculates automatically.</div></div>
    <div class="page-actions">
      <button class="btn btn-ghost" onclick="goto('walls')">← Back</button>
      <button class="btn btn-primary" onclick="goto('output')">Generate bid output →</button>
    </div>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Location</th><th>Type ID</th><th>Height (ft)</th>
        <th>SF ceiling</th><th>Soffit LF</th><th>Openings (SF)</th><th>Net SF</th><th></th>
      </tr></thead>
      <tbody id="ceil-body"></tbody>
    </table>
  </div>
  <button class="add-row-btn" onclick="addCeil()">+ Add ceiling area</button>
</template>

<template id="legacy-tpl-output">
  <div class="page-hdr">
    <div>
      <div class="page-title">Initial Bid</div>
      <div class="page-sub">Direct cost breakdown and pricing</div>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost" onclick="goto('ceilings')">← Back</button>
      <button class="btn btn-ghost" onclick="runCalculation()">↻ Recalculate</button>
      <button class="btn btn-primary" onclick="goto('agent')">Next: Agent Recommendation →</button>
    </div>
  </div>

  <!-- Dynamic: Phase 3 direct cost output -->
  <div id="output-phase3">
    <div class="empty-state">Complete rates and click "Generate bid output →" to calculate.</div>
  </div>

  <!-- Static: Markup input panel -->
  <div class="section-block">
    <div class="section-label">Markup</div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:20px 20px 8px">
      <div class="rgrid g3">
        <div class="rcard">
          <div class="rcard-lbl">Company overhead <span class="badge b-pct">%</span></div>
          <div class="iw"><input id="markup-overhead" class="ri" type="number" min="0" step="0.1" placeholder="10.0"><span class="isfx">%</span></div>
          <div class="rhint">Office, insurance, fleet — % of direct costs</div>
        </div>
        <div class="rcard">
          <div class="rcard-lbl">Risk / contingency <span class="badge b-pct">%</span></div>
          <div class="iw"><input id="markup-contingency" class="ri" type="number" min="0" step="0.1" placeholder="—"><span class="isfx">%</span></div>
          <div class="rhint">Pre-filled from confidence level — editable</div>
        </div>
        <div class="rcard">
          <div class="rcard-lbl">Profit margin <span class="badge b-pct">%</span></div>
          <div class="iw"><input id="markup-profit" class="ri" type="number" min="0" step="0.1" placeholder="8.0"><span class="isfx">%</span></div>
          <div class="rhint">Target profit on direct costs</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dynamic: Phase 4 pricing breakdown + final bid price -->
  <div id="output-bid"></div>
</template>

<template id="legacy-tpl-agent">
  <div class="empty-state">Generate a bid output (Tab 7) to get the agent's recommendation.</div>
</template>

<template id="legacy-tpl-dashboard">
  <div class="empty-state">Loading drafts…</div>
</template>

<div id="dev-toolbar" class="dev-toolbar">
  <span class="dev-toolbar-label">Demo controls</span>
  <button class="btn btn-ghost" onclick="loadSeedData()">Load seed data</button>
  <button class="btn btn-ghost" onclick="clearSeedData()">Clear all data</button>
  <button class="btn btn-ghost" onclick="document.getElementById('dev-toolbar').style.display='none'">Hide</button>
</div>

<script src="js/autosave.js"></script>
<script src="js/drafts.js"></script>
<script src="js/state.js"></script>
<script src="js/calculator.js"></script>
<script src="js/history-analytics.js"></script>
<script src="js/history.js"></script>
<script src="js/rate-templates.js"></script>
<script src="js/agent.js"></script>
<script src="js/forms.js"></script>
<script src="js/tabs.js"></script>
<script src="js/ui.js"></script>
<script src="data/seed.js"></script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
