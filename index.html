<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dirigo Drywall — Bid System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- A2 spike: AppShell (header/left nav/tabs) + RatesPage + HistoryPage
     render here. Every not-yet-converted page's exact original markup is
     kept below in inert <template> tags — LegacyPage (src/pages/LegacyPage.jsx)
     clones a template's content into its own DOM once on first mount, then
     never lets React touch those children again, so the old vanilla
     scripts (populateForm(), addAsm(), calc(), etc.) keep operating on
     real, unmanaged DOM exactly as before. See CLAUDE.md and the A2 plan
     for the full coexistence architecture. -->
<div id="root"></div>

<template id="legacy-tpl-agent">
  <div class="empty-state">Generate a bid output (Tab 7) to get the agent's recommendation.</div>
</template>

<template id="legacy-tpl-dashboard">
  <div class="empty-state">Loading drafts…</div>
</template>

<div id="dev-toolbar" class="dev-toolbar">
  <span class="dev-toolbar-label">Demo controls</span>
  <button class="btn btn-ghost" onclick="loadSeedData()">Load seed data</button>
  <button class="btn btn-ghost" onclick="clearSeedData()">Clear all data</button>
  <button class="btn btn-ghost" onclick="document.getElementById('dev-toolbar').style.display='none'">Hide</button>
</div>

<script src="js/autosave.js"></script>
<script src="js/drafts.js"></script>
<script src="js/state.js"></script>
<script src="js/calculator.js"></script>
<script src="js/history-analytics.js"></script>
<script src="js/history.js"></script>
<script src="js/rate-templates.js"></script>
<script src="js/agent.js"></script>
<script src="js/forms.js"></script>
<script src="js/tabs.js"></script>
<script src="js/ui.js"></script>
<script src="data/seed.js"></script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
